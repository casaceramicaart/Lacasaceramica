<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser ma commande – Casa Céramica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F9F8F6;
            --text-color: #1A1A1A;
            --text-muted: #6B6661;
            --accent-color: #9A5B3E;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        
        .checkout-container { max-width: 550px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        
        /* Flèche retour */
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; transition: 0.3s; }
        .back-link:hover { color: var(--text-color); }

        h1 { font-family: var(--font-heading); font-weight: 400; font-size: 1.8rem; margin-bottom: 20px; letter-spacing: 1px; }
        
        .cart-summary { border-bottom: 1px solid #e0ddd8; padding-bottom: 15px; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .cart-item .qty { color: var(--text-muted); }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 500; margin-top: 10px; color: var(--accent-color); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 0 6px; border: none; border-bottom: 1px solid #d6d2cc; background: transparent; outline: none; font-family: inherit; font-size: 1rem; color: var(--text-color); }
        .form-group input:focus, .form-group select:focus { border-bottom-color: var(--text-color); }
        .form-group select { appearance: none; }

        .btn-submit { width: 100%; background: var(--text-color); color: #fff; border: none; padding: 14px; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.3s; border-radius: 4px; margin-top: 10px; }
        .btn-submit:hover { background: var(--accent-color); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .cart-payment-note { font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 15px; }

        @media (max-width: 480px) { .checkout-container { padding: 20px; } }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- Flèche retour -->
        <a href="index.html" class="back-link">← Retour aux achats</a>

        <h1>Finaliser ma demande</h1>

        <!-- Récapitulatif du panier -->
        <div class="cart-summary" id="cartSummary">
            <p style="color: #888; font-style: italic;">Chargement du panier...</p>
        </div>

        <!-- Formulaire de commande -->
        <form id="checkoutForm">
            
            <div class="form-group">
                <label for="deliveryMode">Mode de livraison</label>
                <select id="deliveryMode" onchange="toggleAddressField()">
                    <option value="Livraison à domicile">Livraison à domicile</option>
                    <option value="Point de retrait (Val da Figueira)">Point de retrait (Val da Figueira)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Nom &amp; Prénom *</label>
                <input type="text" id="name" required placeholder="Votre nom complet">
            </div>
            <div class="form-group">
                <label for="contact">Téléphone ou Email *</label>
                <input type="text" id="contact" required placeholder="06 00 00 00 00">
            </div>
            
            <!-- Champ Adresse : obligatoire seulement en mode livraison -->
            <div class="form-group" id="addressGroup">
                <label for="address">Adresse de livraison</label>
                <input type="text" id="address" placeholder="Rue, code postal, ville">
            </div>
            
            <div class="form-group">
                <label for="timeslot">Créneau horaire souhaité</label>
                <select id="timeslot">
                    <option value="Matin (9h-12h)">Matin (9h-12h)</option>
                    <option value="Après-midi (14h-18h)">Après-midi (14h-18h)</option>
                    <option value="Soirée (18h-20h)">Soirée (18h-20h)</option>
                    <option value="Je suis flexible">Je suis flexible</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Notes (optionnel)</label>
                <input type="text" id="notes" placeholder="Instructions particulières...">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Envoyer ma demande</button>
        </form>

        <div class="cart-payment-note">Aucun paiement en ligne. Vous réglez lors de la remise.</div>
    </div>

    <script>
        (function() {
            'use strict';
            let cart = [];

            // Gestion du champ adresse
            window.toggleAddressField = function() {
                const mode = document.getElementById('deliveryMode').value;
                const addressInput = document.getElementById('address');
                const addressGroup = document.getElementById('addressGroup');

                if (mode === 'Point de retrait (Val da Figueira)') {
                    addressInput.required = false;
                    addressGroup.style.opacity = '0.5';
                    addressInput.placeholder = "Non requis (Point de retrait)";
                } else {
                    addressInput.required = true;
                    addressGroup.style.opacity = '1';
                    addressInput.placeholder = "Rue, code postal, ville";
                }
            };

            function loadCart() {
                const stored = localStorage.getItem('casaCeramicaCart');
                if (stored) {
                    try {
                        cart = JSON.parse(stored).map(i => ({...i, quantity: parseInt(i.quantity,10)||0})).filter(i => i.quantity > 0);
                    } catch(e) { cart = []; }
                }
                renderSummary();
            }

            function renderSummary() {
                const container = document.getElementById('cartSummary');
                if (cart.length === 0) {
                    container.innerHTML = `<p style="color: #888; font-style: italic; text-align:center;">Votre panier est vide. <br><a href="index.html" style="color: var(--text-color);">Retour à la boutique</a></p>`;
                    document.getElementById('submitBtn').disabled = true;
                    return;
                }
                
                let html = '';
                let total = 0;
                cart.forEach(item => {
                    const qty = item.quantity;
                    const price = item.price;
                    total += price * qty;
                    html += `
                        <div class="cart-item">
                            <span>${item.name} <span class="qty">x${qty}</span></span>
                            <span>${(price * qty).toFixed(0)} €</span>
                        </div>
                    `;
                });
                html += `<div class="cart-total"><span>Total</span><span>${total.toFixed(0)} €</span></div>`;
                container.innerHTML = html;
                document.getElementById('submitBtn').disabled = false;
            }

            const form = document.getElementById('checkoutForm');
            const submitBtn = document.getElementById('submitBtn');
            let isSubmitting = false;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (isSubmitting) return;
                if (cart.length === 0) { alert('Votre panier est vide.'); return; }

                const deliveryMode = document.getElementById('deliveryMode').value;
                const name = document.getElementById('name').value.trim();
                const contact = document.getElementById('contact').value.trim();
                const address = document.getElementById('address').value.trim();
                const timeslot = document.getElementById('timeslot').value;
                const notes = document.getElementById('notes').value.trim();

                // Validation : si livraison à domicile, adresse obligatoire
                if (deliveryMode === 'Livraison à domicile' && !address) {
                    alert('Veuillez indiquer une adresse de livraison.');
                    return;
                }

                if (!name || !contact) {
                    alert('Veuillez remplir le nom et le contact.');
                    return;
                }

                isSubmitting = true;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Envoi en cours...';

                let summary = '';
                let total = 0;
                cart.forEach(item => {
                    const qty = item.quantity;
                    summary += `${item.name} x${qty} = ${item.price * qty} €\n`;
                    total += item.price * qty;
                });

                const orderNumber = 'CASA-' + Date.now().toString().slice(-6);
                let body = `Numéro de commande: ${orderNumber}\n\n`;
                body += `Mode de livraison: ${deliveryMode}\n`;
                body += `Nom: ${name}\nContact: ${contact}\n`;
                if(address) body += `Adresse: ${address}\n`;
                body += `Créneau: ${timeslot}\nNotes: ${notes}\n\n${summary}\nTotal: ${total} €`;

                window.location.href = `mailto:lacasaceramica@protonmail.com?subject=Commande Casa Céramica ${orderNumber}&body=${encodeURIComponent(body)}`;

                let existingOrders = JSON.parse(localStorage.getItem('casaCeramicaOrders')) || [];
                existingOrders.push({ 
                    date: new Date().toISOString(), 
                    deliveryMode: deliveryMode,
                    name: name, contact: contact, address: address, timeslot: timeslot, notes: notes, 
                    items: summary, total: total + ' €', status: 'En attente', orderNumber: orderNumber 
                });
                localStorage.setItem('casaCeramicaOrders', JSON.stringify(existingOrders));

                localStorage.removeItem('casaCeramicaCart');
                
                alert('✅ Demande envoyée ! Nous vous confirmerons la date exacte par email d\'ici 2 heures.');
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            });

            toggleAddressField(); // Initialisation
            loadCart();
        })();
    </script>
</body>
</html>
